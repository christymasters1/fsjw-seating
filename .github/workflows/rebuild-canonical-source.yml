name: Sync canonical seating source

on:
  push:
    paths:
      - 'src/index.html'
      - '.github/workflows/rebuild-canonical-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync deployable app from maintained source
        run: cp src/index.html index.html

      - name: Verify canonical source
        run: |
          cmp --silent index.html src/index.html
          grep -q 'Choose the event you are seating' index.html
          grep -q 'RBNYE 26' index.html
          grep -q 'DJW 27' index.html
          echo 'Canonical source verification passed.'

      - name: Commit canonical app
        run: |
          if [ -z "$(git status --porcelain -- index.html src/index.html)" ]; then
            echo 'No canonical app change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/index.html
          git commit -m 'Sync canonical seating source'
          git push
