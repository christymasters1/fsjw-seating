<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FSJW Seating Manager</title>
<style>
  html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#172033}
  .load{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  .card{width:min(420px,92vw);background:#fff;border:1px solid #dfe4ea;border-radius:14px;padding:28px;text-align:center;box-sizing:border-box}
  h1{margin:0 0 8px;color:#2B4692;font-size:22px}.small{font-size:13px;color:#6b7280;line-height:1.45}
</style>
</head>
<body>
<div class="load"><div class="card"><h1>FSJW Seating Manager</h1><div id="msg" class="small">Loading seating manager…</div></div></div>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  try{
    if(typeof DecompressionStream==='undefined') throw new Error('This browser needs to be updated before the seating manager can load.');
    const urls=Array.from({length:8},(_,i)=>`payload/v5-${i+1}.txt?v=5`);
    const parts=await Promise.all(urls.map(async url=>{
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok) throw new Error(`Could not load app file (${r.status}).`);
      return r.text();
    }));
    const b64=parts.join('').replace(/\s+/g,'');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let appHtml=await new Response(stream).text();
    if(!appHtml.includes('<title>FSJW Seating Manager</title>') || !appHtml.includes('Priority Request Worklists')) {
      throw new Error('The app package did not pass its integrity check.');
    }
    appHtml=appHtml.replace('</head>','<link rel="stylesheet" href="patch/v6.css?v=6"></head>');
    appHtml=appHtml.replace('</body>','<script src="patch/v6.js?v=6"><\/script></body>');
    document.open();
    document.write(appHtml);
    document.close();
  }catch(err){
    console.error(err);
    msg.innerHTML='FSJW Seating Manager could not load.<br><br>Please refresh the page. If it still does not load, contact Christy.<br><br><span style="font-size:11px">'+String(err.message||err)+'</span>';
  }
})();
</script>
</body>
</html>
